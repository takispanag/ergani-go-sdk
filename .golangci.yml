run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - errorlint
    - gofmt
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  misspell:
    locale: US
  staticcheck:
    checks: ["all"]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
